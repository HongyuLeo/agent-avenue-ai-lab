name: C++ tests

permissions:
  contents: write

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build Windows application
        run: cmake --build build --config Release --target agent_avenue_ai_lab
      - name: Assemble Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact\assets | Out-Null
          Copy-Item build\Release\agent_avenue_ai_lab.exe artifact\AgentAvenueAI.exe
          Copy-Item assets\cards artifact\assets\cards -Recurse
          Copy-Item models\pretrained-17m.bin artifact\training.bin
          Copy-Item LICENSE artifact\LICENSE.txt
          Copy-Item docs\RELEASE_NOTES_v2.2.1.md artifact\README.txt
          Compress-Archive -Path artifact\* -DestinationPath AgentAvenueAI-Public-v2.2.1-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AgentAvenueAI-Public-v2.2.1-Windows
          path: AgentAvenueAI-Public-v2.2.1-Windows.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME AgentAvenueAI-Public-v2.2.1-Windows.zip `
            --title "Agent Avenue AI v2.2.1 — Self-Play RL + Human-vs-AI Desktop App" `
            --notes-file docs\RELEASE_NOTES_v2.2.1.md `
            --latest
